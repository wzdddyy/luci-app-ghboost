name: build-luci

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建完成后更新 luci-latest Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-bin:
    name: placeholder binary (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { path: src }

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache-dependency-path: src/ghboost/go.mod

      - name: Build
        working-directory: src/ghboost
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VER=$(grep -m1 '^PKG_VERSION:=' ../Makefile | cut -d= -f2 | tr -d ' ')
          echo "version=$VER"
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -extldflags=-static -X main.version=$VER -X main.statusVersion=$VER" \
            -o ../ghboost-linux-amd64 .

      - uses: actions/upload-artifact@v6
        with:
          name: bin-amd64
          path: src/ghboost-linux-amd64
          if-no-files-found: error

  build-pkg:
    name: ${{ matrix.label }}
    needs: build-bin
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apk
            openwrt: "25.12.5"
            sdkpath: x86/64
            sdkfile: x86-64
            gcc: "14.3.0"
            target: x86
            subtarget: "64"
            ext: apk
          - label: ipk
            openwrt: "24.10.6"
            sdkpath: x86/64
            sdkfile: x86-64
            gcc: "13.3.0"
            target: x86
            subtarget: "64"
            ext: ipk

    steps:
      - uses: actions/checkout@v5
        with: { path: src }

      - name: Install deps
        run: |
          set -euo pipefail
          missing=""
          for c in gcc g++ make bison flex gawk git python3 rsync unzip zstd file wget bc perl; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          command -v msgfmt >/dev/null 2>&1 || missing="$missing gettext"
          for h in libelf-dev libncurses-dev libssl-dev zlib1g-dev; do
            dpkg -s "$h" >/dev/null 2>&1 || missing="$missing $h"
          done
          if [ -n "$missing" ]; then
            echo "runner 缺少:$missing -> 开始安装"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
            sudo apt-get clean
          else
            echo "runner 已自带全部构建依赖, 跳过 apt"
          fi

      - name: Cache SDK tarball
        uses: actions/cache@v5
        with:
          path: ~/sdk-cache
          key: sdk-${{ matrix.openwrt }}-${{ matrix.sdkfile }}-gcc${{ matrix.gcc }}

      - name: Fetch placeholder binary
        uses: actions/download-artifact@v7
        with:
          name: bin-amd64
          path: src/files/usr/bin

      - name: Download SDK ${{ matrix.openwrt }}
        run: |
          set -euo pipefail
          sdk="openwrt-sdk-${{ matrix.openwrt }}-${{ matrix.sdkfile }}_gcc-${{ matrix.gcc }}_musl.Linux-x86_64.tar.zst"
          mkdir -p ~/sdk-cache sdk
          if [ -s ~/sdk-cache/"$sdk" ]; then
            echo "SDK 命中缓存, 跳过下载: $sdk"
          else
            url="https://downloads.openwrt.org/releases/${{ matrix.openwrt }}/targets/${{ matrix.sdkpath }}/$sdk"
            echo "GET $url"
            wget -q -O ~/sdk-cache/"$sdk" "$url"
          fi
          tar -I zstd -xf ~/sdk-cache/"$sdk" -C sdk --strip-components=1

      - name: Stage package
        run: |
          set -euo pipefail
          mv src/files/usr/bin/ghboost-linux-amd64 src/files/usr/bin/ghboost
          chmod +x src/files/usr/bin/ghboost

          mkdir -p sdk/package/luci-app-ghboost
          rsync -a \
            --exclude '/.git/' --exclude '/.github/' --exclude '/ghboost/' \
            src/ sdk/package/luci-app-ghboost/

      - name: Build package
        working-directory: sdk
        env:
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf

          echo "=== feeds 全量更新/安装 ==="
          echo "lua 和 ucode 都在 base feed (package/feeds/base/)，只装 luci/packages 会缺它们，"
          echo "进而导致 lucihttp 编译时 fatal error: lua.h / ucode/module.h"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          {
            echo "CONFIG_TARGET_${TARGET}=y"
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"
            echo "CONFIG_PACKAGE_luci-app-ghboost=m"
          } > .config
          make defconfig 2>&1 | tee /tmp/defconfig.log

          for k in "CONFIG_TARGET_${TARGET}=y" "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"; do
            grep -qx "$k" .config || {
              echo "ERROR: $k 没有生效, SDK 与 target 不匹配?" >&2
              grep -E '^CONFIG_TARGET' .config | head -20 >&2
              exit 1
            }
          done

          grep -qx "CONFIG_PACKAGE_luci-app-ghboost=m" .config || {
            echo "ERROR: CONFIG_PACKAGE_luci-app-ghboost 没有进 .config" >&2
            grep -niE "luci-app-ghboost|dependency" /tmp/defconfig.log | head -30 >&2 || true
            exit 1
          }

          echo "--- 包选择 ---"
          grep -E '^CONFIG_PACKAGE_(ghboost|luci-app-ghboost|liblucihttp.*|libucode|lua)=' .config || true

          echo "--- lua / ucode 包目录（只认 PKG_NAME 精确匹配）---"
          find_pkg_dir() {
            local name="$1" d
            for d in package/*/"$name" package/*/*/"$name" package/*/*/*/"$name"; do
              [ -f "$d/Makefile" ] || continue
              grep -qx "PKG_NAME:=$name" "$d/Makefile" || continue
              echo "$d"
            done | sort -u
          }
          LUA_DIRS=$(find_pkg_dir lua || true)
          UCODE_DIRS=$(find_pkg_dir ucode || true)
          echo "lua:   ${LUA_DIRS:-<没找到>}"
          echo "ucode: ${UCODE_DIRS:-<没找到>}"

          [ -n "$LUA_DIRS" ] || { echo "ERROR: 没找到 lua 包目录, feeds 不完整" >&2; find package -maxdepth 4 -name Makefile | grep -iE '/(lua|ucode)/Makefile' >&2 || true; exit 1; }
          [ -n "$UCODE_DIRS" ] || { echo "ERROR: 没找到 ucode 包目录, feeds 不完整" >&2; find package -maxdepth 4 -name Makefile | grep -iE '/(lua|ucode)/Makefile' >&2 || true; exit 1; }

          for d in $LUA_DIRS; do
            echo ">>> 预构建 $d (补 lua.h)"
            make "$d/clean" >/dev/null 2>&1 || true
            make "$d/compile" V=s
          done
          for d in $UCODE_DIRS; do
            echo ">>> 预构建 $d (补 ucode 头文件)"
            make "$d/clean" >/dev/null 2>&1 || true
            make "$d/compile" V=s
          done

          echo "--- staging 头文件检查 ---"
          ls -d staging_dir/target-*/usr/include/lua5.1 2>/dev/null || echo "WARN: 没有 lua5.1 include 目录"
          ls -d staging_dir/target-*/usr/include/ucode  2>/dev/null || echo "WARN: 没有 ucode include 目录"

          if ! make package/luci-app-ghboost/compile V=s BUILD_LOG=1 -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "::error::make 失败, 下面是过滤掉内核模块噪音后的关键行"
            grep -nE 'Error [0-9]|error:|fatal error|\*\*\* |No rule to make target|No such file' /tmp/build.log \
              | grep -vE 'for mod in |ERROR: module ' | tail -60 || true
            exit 1
          fi

          echo "--- 编出来的包 ---"
          find bin/packages -type f | sort
          find bin/packages -type f -name "luci-app-ghboost*.${EXT}" -print -quit | grep -q . || {
            echo "ERROR: 没有产出 luci-app-ghboost 的 .${EXT} 包 (上面清单就是全部产物)" >&2
            exit 1
          }

      - name: Collect
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          while IFS= read -r f; do
            cp -v "$f" "out/luci-app-ghboost_all.${EXT}"
            n=$((n + 1))
          done < <(find sdk/bin/packages -type f -name "luci-app-ghboost*.${EXT}")
          ls -lh out/
          test "$n" -eq 1 || { echo "ERROR: 期望 1 个 luci 包, 实际 $n 个" >&2; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.label }}
          path: |
            /tmp/build.log
            /tmp/defconfig.log
            sdk/logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish luci-latest
    needs: [build-bin, build-pkg]
    if: github.event.inputs.publish != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: pkg-*

      - name: Flatten
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -exec cp -v {} out/ \;
          ls -lh out/
          test "$(ls -1 out | wc -l | tr -d ' ')" -eq 2 || {
            echo "ERROR: 期望 2 个安装包 (apk + ipk)" >&2
            ls -1 out >&2; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: luci-latest
        run: |
          set -euo pipefail
          ver=$(grep -m1 '^PKG_VERSION:=' Makefile | cut -d= -f2 | tr -d ' ')
          rel=$(grep -m1 '^PKG_RELEASE:=' Makefile | cut -d= -f2 | tr -d ' ')

          cat > notes.md <<EOF
          **luci-app-ghboost** 界面包，滚动发布。

          - 版本: \`${ver}-r${rel}\`
          - 提交: \`${GITHUB_SHA::7}\`
          - 构建: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z')
          - 依赖: **先装核心包 \`ghboost\`**

          **在线安装**

          wget -O /tmp/luci-app-ghboost_all.apk https://github.com/wzdddyy/luci-app-ghboost/releases/download/luci-latest/luci-app-ghboost_all.apk

          apk add --allow-untrusted /tmp/luci-app-ghboost_all.apk

          wget -O /tmp/luci-app-ghboost_all.ipk https://github.com/wzdddyy/luci-app-ghboost/releases/download/luci-latest/luci-app-ghboost_all.ipk

          opkg install /tmp/luci-app-ghboost_all.ipk

          \`\`\`
          EOF

          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --title "luci-app-ghboost (rolling)" --notes-file notes.md --latest=false
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "luci-app-ghboost ${ver}-r${rel}" --notes-file notes.md --latest=false
