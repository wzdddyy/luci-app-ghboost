name: build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建完成后更新 latest Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-core:
    name: core ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: apk-aarch64
            openwrt: "25.12.5"
            sdkpath: mediatek/filogic
            sdkfile: mediatek-filogic
            gcc: "14.3.0"
            target: mediatek
            subtarget: filogic
            pkgarch: aarch64_cortex-a53
            ext: apk

          - label: ipk-aarch64
            openwrt: "24.10.6"
            sdkpath: mediatek/filogic
            sdkfile: mediatek-filogic
            gcc: "13.3.0"
            target: mediatek
            subtarget: filogic
            pkgarch: aarch64_cortex-a53
            ext: ipk

          - label: apk-x86_64
            openwrt: "25.12.5"
            sdkpath: x86/64
            sdkfile: x86-64
            gcc: "14.3.0"
            target: x86
            subtarget: "64"
            pkgarch: x86_64
            ext: apk

          - label: ipk-x86_64
            openwrt: "24.10.6"
            sdkpath: x86/64
            sdkfile: x86-64
            gcc: "13.3.0"
            target: x86
            subtarget: "64"
            pkgarch: x86_64
            ext: ipk

          - label: apk-aarch64_cortex-a72
            openwrt: "25.12.5"
            sdkpath: bcm27xx/bcm2711
            sdkfile: bcm27xx-bcm2711
            gcc: "14.3.0"
            target: bcm27xx
            subtarget: bcm2711
            pkgarch: aarch64_cortex-a72
            ext: apk

          - label: ipk-aarch64_cortex-a72
            openwrt: "24.10.6"
            sdkpath: bcm27xx/bcm2711
            sdkfile: bcm27xx-bcm2711
            gcc: "13.3.0"
            target: bcm27xx
            subtarget: bcm2711
            pkgarch: aarch64_cortex-a72
            ext: ipk

          - label: apk-aarch64_generic
            openwrt: "25.12.5"
            sdkpath: armsr/armv8
            sdkfile: armsr-armv8
            gcc: "14.3.0"
            target: armsr
            subtarget: armv8
            pkgarch: aarch64_generic
            ext: apk

          - label: ipk-aarch64_generic
            openwrt: "24.10.6"
            sdkpath: armsr/armv8
            sdkfile: armsr-armv8
            gcc: "13.3.0"
            target: armsr
            subtarget: armv8
            pkgarch: aarch64_generic
            ext: ipk

          - label: apk-arm_cortex-a7_neon-vfpv4
            openwrt: "25.12.5"
            sdkpath: ipq40xx/generic
            sdkfile: ipq40xx-generic
            gcc: "14.3.0"
            target: ipq40xx
            subtarget: generic
            pkgarch: arm_cortex-a7_neon-vfpv4
            ext: apk

          - label: ipk-arm_cortex-a7_neon-vfpv4
            openwrt: "24.10.6"
            sdkpath: ipq40xx/generic
            sdkfile: ipq40xx-generic
            gcc: "13.3.0"
            target: ipq40xx
            subtarget: generic
            pkgarch: arm_cortex-a7_neon-vfpv4
            ext: ipk

          - label: apk-arm_cortex-a9
            openwrt: "25.12.5"
            sdkpath: bcm53xx/generic
            sdkfile: bcm53xx-generic
            gcc: "14.3.0"
            target: bcm53xx
            subtarget: generic
            pkgarch: arm_cortex-a9
            ext: apk

          - label: ipk-arm_cortex-a9
            openwrt: "24.10.6"
            sdkpath: bcm53xx/generic
            sdkfile: bcm53xx-generic
            gcc: "13.3.0"
            target: bcm53xx
            subtarget: generic
            pkgarch: arm_cortex-a9
            ext: ipk

          - label: apk-arm_cortex-a9_neon
            openwrt: "25.12.5"
            sdkpath: imx/cortexa9
            sdkfile: imx-cortexa9
            gcc: "14.3.0"
            target: imx
            subtarget: cortexa9
            pkgarch: arm_cortex-a9_neon
            ext: apk

          - label: ipk-arm_cortex-a9_neon
            openwrt: "24.10.6"
            sdkpath: imx/cortexa9
            sdkfile: imx-cortexa9
            gcc: "13.3.0"
            target: imx
            subtarget: cortexa9
            pkgarch: arm_cortex-a9_neon
            ext: ipk

    steps:
      - uses: actions/checkout@v5
        with: { path: src }

      - name: Install deps
        run: |
          set -euo pipefail
          missing=""
          for c in gcc g++ make bison flex gawk git python3 rsync unzip zstd file wget bc perl; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          command -v msgfmt >/dev/null 2>&1 || missing="$missing gettext"
          for h in libelf-dev libncurses-dev libssl-dev zlib1g-dev; do
            dpkg -s "$h" >/dev/null 2>&1 || missing="$missing $h"
          done

          if [ -n "$missing" ]; then
            echo "runner 缺少:$missing -> 开始安装"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
            sudo apt-get clean
          else
            echo "runner 已自带全部构建依赖, 跳过 apt"
          fi

      - name: Cache SDK tarball
        uses: actions/cache@v5
        with:
          path: ~/sdk-cache
          key: sdk-${{ matrix.openwrt }}-${{ matrix.sdkfile }}-gcc${{ matrix.gcc }}

      - name: Download SDK ${{ matrix.openwrt }} (${{ matrix.sdkpath }})
        run: |
          set -euo pipefail
          abi=""
          if [ "${{ matrix.target }}" = "ipq40xx" ] || [ "${{ matrix.target }}" = "bcm53xx" ] || [ "${{ matrix.target }}" = "imx" ]; then
            abi="_eabi"
          fi
          sdk="openwrt-sdk-${{ matrix.openwrt }}-${{ matrix.sdkfile }}_gcc-${{ matrix.gcc }}_musl${abi}.Linux-x86_64.tar.zst"
          mkdir -p ~/sdk-cache sdk
          if [ -s ~/sdk-cache/"$sdk" ]; then
            echo "SDK 命中缓存, 跳过下载: $sdk"
          else
            url="https://downloads.openwrt.org/releases/${{ matrix.openwrt }}/targets/${{ matrix.sdkpath }}/$sdk"
            echo "GET $url"
            wget -q -O ~/sdk-cache/"$sdk" "$url"
          fi
          tar -I zstd -xf ~/sdk-cache/"$sdk" -C sdk --strip-components=1

      - name: Stage package
        run: |
          set -euo pipefail
          mkdir -p sdk/package/ghboost
          rsync -a \
            --exclude '/.git/' --exclude '/.github/' \
            src/ghboost/ sdk/package/ghboost/

      - name: Build package
        working-directory: sdk
        env:
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          {
            echo "CONFIG_TARGET_${TARGET}=y"
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"
            echo "CONFIG_PACKAGE_ghboost=m"
          } > .config
          make defconfig 2>&1 | tee /tmp/defconfig.log

          for k in "CONFIG_TARGET_${TARGET}=y" "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"; do
            grep -qx "$k" .config || {
              echo "ERROR: $k 没有生效, SDK 与 target 不匹配?" >&2
              grep -E '^CONFIG_TARGET' .config | head -20 >&2
              exit 1
            }
          done

          grep -qx "CONFIG_PACKAGE_ghboost=m" .config || {
            echo "ERROR: CONFIG_PACKAGE_ghboost 没有进 .config" >&2
            grep -niE "ghboost|dependency" /tmp/defconfig.log | head -30 >&2 || true
            exit 1
          }

          if ! make package/ghboost/compile V=s -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "::error::make 失败, 下面是日志里的关键行"
            grep -nE 'Error [0-9]|error:|fatal error|\*\*\* |No targets|No such file|ERROR:' /tmp/build.log | tail -80 || true
            exit 1
          fi

          echo "--- 编出来的包 ---"
          find bin/packages -type f | sort
          find bin/packages -type f -name "ghboost*.${EXT}" -print -quit | grep -q . || {
            echo "ERROR: 没有产出 ghboost 的 .${EXT} 包 (上面清单就是全部产物)" >&2
            exit 1
          }

      - name: Collect
        env:
          EXT: ${{ matrix.ext }}
          ARCH_TAG: ${{ matrix.pkgarch }}
        run: |
          set -euo pipefail
          pkg=$(find sdk/bin/packages -type f -name "ghboost*.${EXT}" -print -quit)
          [ -n "$pkg" ] || { echo "ERROR: 没找到 ghboost 的 .${EXT} 包" >&2; exit 1; }
          actual=$(printf '%s\n' "$pkg" | sed -n 's#.*/bin/packages/\([^/]*\)/.*#\1#p')
          echo "SDK 产物架构=$actual 期望=$ARCH_TAG ($pkg)"
          [ "$actual" = "$ARCH_TAG" ] || {
            echo "ERROR: 实际架构 ($actual) 与 pkgarch ($ARCH_TAG) 不一致, 检查 target/subtarget 选型" >&2
            exit 1
          }
          mkdir -p out
          n=0
          while IFS= read -r f; do
            cp -v "$f" "out/ghboost_${ARCH_TAG}.${EXT}"
            n=$((n + 1))
          done < <(find sdk/bin/packages -type f -name "ghboost*.${EXT}")
          ls -lh out/
          test "$n" -eq 1 || { echo "ERROR: 期望 1 个核心包, 实际 $n 个" >&2; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.label }}
          path: /tmp/build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  build-luci:
    name: luci ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: luci-apk
            openwrt: "25.12.5"
            sdkpath: x86/64
            sdkfile: x86-64
            gcc: "14.3.0"
            target: x86
            subtarget: "64"
            ext: apk
          - label: luci-ipk
            openwrt: "24.10.6"
            sdkpath: x86/64
            sdkfile: x86-64
            gcc: "13.3.0"
            target: x86
            subtarget: "64"
            ext: ipk

    steps:
      - uses: actions/checkout@v5
        with: { path: src }

      - name: Install deps
        run: |
          set -euo pipefail
          missing=""
          for c in gcc g++ make bison flex gawk git python3 rsync unzip zstd file wget bc perl; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          command -v msgfmt >/dev/null 2>&1 || missing="$missing gettext"
          for h in libelf-dev libncurses-dev libssl-dev zlib1g-dev; do
            dpkg -s "$h" >/dev/null 2>&1 || missing="$missing $h"
          done
          if [ -n "$missing" ]; then
            echo "runner 缺少:$missing -> 开始安装"
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends $missing
            sudo apt-get clean
          else
            echo "runner 已自带全部构建依赖, 跳过 apt"
          fi

      - name: Cache SDK tarball
        uses: actions/cache@v5
        with:
          path: ~/sdk-cache
          key: sdk-${{ matrix.openwrt }}-${{ matrix.sdkfile }}-gcc${{ matrix.gcc }}

      - name: Download SDK ${{ matrix.openwrt }}
        run: |
          set -euo pipefail
          sdk="openwrt-sdk-${{ matrix.openwrt }}-${{ matrix.sdkfile }}_gcc-${{ matrix.gcc }}_musl.Linux-x86_64.tar.zst"
          mkdir -p ~/sdk-cache sdk
          if [ -s ~/sdk-cache/"$sdk" ]; then
            echo "SDK 命中缓存, 跳过下载: $sdk"
          else
            url="https://downloads.openwrt.org/releases/${{ matrix.openwrt }}/targets/${{ matrix.sdkpath }}/$sdk"
            echo "GET $url"
            wget -q -O ~/sdk-cache/"$sdk" "$url"
          fi
          tar -I zstd -xf ~/sdk-cache/"$sdk" -C sdk --strip-components=1

      - name: Stage package
        run: |
          set -euo pipefail
          mkdir -p sdk/package/luci-app-ghboost
          rsync -a \
            --exclude '/.git/' --exclude '/.github/' \
            src/luci-app-ghboost/ sdk/package/luci-app-ghboost/

      - name: Build package
        working-directory: sdk
        env:
          TARGET: ${{ matrix.target }}
          SUBTARGET: ${{ matrix.subtarget }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          [ -f feeds.conf ] || cp feeds.conf.default feeds.conf

          echo "=== feeds 全量更新/安装 ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          rm -rf feeds/luci/applications/luci-app-ghboost package/feeds/luci/luci-app-ghboost

          {
            echo "CONFIG_TARGET_${TARGET}=y"
            echo "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"
            echo "CONFIG_PACKAGE_luci-app-ghboost=m"
          } > .config
          make defconfig 2>&1 | tee /tmp/defconfig.log

          for k in "CONFIG_TARGET_${TARGET}=y" "CONFIG_TARGET_${TARGET}_${SUBTARGET}=y"; do
            grep -qx "$k" .config || {
              echo "ERROR: $k 没有生效, SDK 与 target 不匹配?" >&2
              grep -E '^CONFIG_TARGET' .config | head -20 >&2
              exit 1
            }
          done

          grep -qx "CONFIG_PACKAGE_luci-app-ghboost=m" .config || {
            echo "ERROR: CONFIG_PACKAGE_luci-app-ghboost 没有进 .config" >&2
            grep -niE "luci-app-ghboost|dependency" /tmp/defconfig.log | head -30 >&2 || true
            exit 1
          }

          echo "--- 包选择 ---"
          grep -E '^CONFIG_PACKAGE_(ghboost|luci-app-ghboost|liblucihttp.*|libucode|lua)=' .config || true

          echo "--- lua / ucode 包目录（只认 PKG_NAME 精确匹配）---"
          find_pkg_dir() {
            local name="$1" d
            for d in package/*/"$name" package/*/*/"$name" package/*/*/*/"$name"; do
              [ -f "$d/Makefile" ] || continue
              grep -qx "PKG_NAME:=$name" "$d/Makefile" || continue
              echo "$d"
            done | sort -u
          }
          LUA_DIRS=$(find_pkg_dir lua || true)
          UCODE_DIRS=$(find_pkg_dir ucode || true)
          echo "lua:   ${LUA_DIRS:-<没找到>}"
          echo "ucode: ${UCODE_DIRS:-<没找到>}"

          [ -n "$LUA_DIRS" ] || { echo "ERROR: 没找到 lua 包目录, feeds 不完整" >&2; find package -maxdepth 4 -name Makefile | grep -iE '/(lua|ucode)/Makefile' >&2 || true; exit 1; }
          [ -n "$UCODE_DIRS" ] || { echo "ERROR: 没找到 ucode 包目录, feeds 不完整" >&2; find package -maxdepth 4 -name Makefile | grep -iE '/(lua|ucode)/Makefile' >&2 || true; exit 1; }

          for d in $LUA_DIRS; do
            echo ">>> 预构建 $d (补 lua.h)"
            make "$d/clean" >/dev/null 2>&1 || true
            make "$d/compile" V=s
          done
          for d in $UCODE_DIRS; do
            echo ">>> 预构建 $d (补 ucode 头文件)"
            make "$d/clean" >/dev/null 2>&1 || true
            make "$d/compile" V=s
          done

          echo "--- staging 头文件检查 ---"
          ls -d staging_dir/target-*/usr/include/lua5.1 2>/dev/null || echo "WARN: 没有 lua5.1 include 目录"
          ls -d staging_dir/target-*/usr/include/ucode 2>/dev/null || echo "WARN: 没有 ucode include 目录"

          if ! make package/luci-app-ghboost/compile V=s BUILD_LOG=1 -j"$(nproc)" 2>&1 | tee /tmp/build.log; then
            echo "::error::make 失败, 下面是过滤掉内核模块噪音后的关键行"
            grep -nE 'Error [0-9]|error:|fatal error|\*\*\* |No rule to make target|No such file' /tmp/build.log \
              | grep -vE 'for mod in |ERROR: module ' | tail -60 || true
            exit 1
          fi

          echo "--- 编出来的包 ---"
          find bin/packages -type f | sort
          find bin/packages -type f -name "luci-app-ghboost*.${EXT}" -print -quit | grep -q . || {
            echo "ERROR: 没有产出 luci-app-ghboost 的 .${EXT} 包 (上面清单就是全部产物)" >&2
            exit 1
          }

      - name: Collect
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          while IFS= read -r f; do
            cp -v "$f" "out/luci-app-ghboost_all.${EXT}"
            n=$((n + 1))
          done < <(find sdk/bin/packages -type f -name "luci-app-ghboost*.${EXT}")
          ls -lh out/
          test "$n" -eq 1 || { echo "ERROR: 期望 1 个 luci 包, 实际 $n 个" >&2; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log-${{ matrix.label }}
          path: |
            /tmp/build.log
            /tmp/defconfig.log
            sdk/logs
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        with:
          name: pkg-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish latest
    needs: [build-core, build-luci]
    if: github.event.inputs.publish != 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: pkg-*

      - name: Flatten
        run: |
          set -euo pipefail
          mkdir -p out
          find artifacts -type f -exec cp -v {} out/ \;
          ls -lh out/
          test "$(ls -1 out | wc -l | tr -d ' ')" -eq 16 || {
            echo "ERROR: 期望 16 个包 (核心 14 + 界面 2)" >&2
            ls -1 out >&2; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: latest
        run: |
          set -euo pipefail
          ver_core=$(grep -m1 '^PKG_VERSION:=' ghboost/Makefile | cut -d= -f2 | tr -d ' ')
          rel_core=$(grep -m1 '^PKG_RELEASE:=' ghboost/Makefile | cut -d= -f2 | tr -d ' ')
          ver_ui=$(grep -m1 '^PKG_VERSION:=' luci-app-ghboost/Makefile | cut -d= -f2 | tr -d ' ')
          rel_ui=$(grep -m1 '^PKG_RELEASE:=' luci-app-ghboost/Makefile | cut -d= -f2 | tr -d ' ')
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          archs="aarch64_cortex-a53 aarch64_cortex-a72 aarch64_generic arm_cortex-a7_neon-vfpv4 arm_cortex-a9 arm_cortex-a9_neon x86_64"

          {
            echo "**ghboost 核心包 + LuCI 界面包**，滚动发布：文件名固定，URL 永久有效。"
            echo ""
            echo "- 核心版本: \`${ver_core}-r${rel_core}\`"
            echo "- UI 版本: \`${ver_ui}-r${rel_ui}\`"
            echo "- 提交: \`${GITHUB_SHA::7}\`"
            echo "- 构建: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M %Z')"
            echo ""
            echo "**安装顺序**：先按设备架构装核心包 \`ghboost\`，再装界面包 \`luci-app-ghboost\`（all，通用）。"
            echo ""
            echo "查设备架构："
            echo ""
            echo '```sh'
            echo '. /etc/openwrt_release && echo $DISTRIB_ARCH'
            echo '```'
            echo ""
            echo "**apk 包（OpenWrt 25.x）**"
            echo ""
            for a in $archs; do
              echo "- \`$a\` → [ghboost_${a}.apk](${base}/ghboost_${a}.apk)"
            done
            echo "- 界面包 → [luci-app-ghboost_all.apk](${base}/luci-app-ghboost_all.apk)"
            echo ""
            echo '```sh'
            echo "wget -O /tmp/ghboost.apk ${base}/ghboost_<arch>.apk"
            echo "apk add --allow-untrusted /tmp/ghboost.apk"
            echo "wget -O /tmp/luci-app-ghboost.apk ${base}/luci-app-ghboost_all.apk"
            echo "apk add --allow-untrusted /tmp/luci-app-ghboost.apk"
            echo '```'
            echo ""
            echo "**ipk 包（OpenWrt 24.10）**"
            echo ""
            for a in $archs; do
              echo "- \`$a\` → [ghboost_${a}.ipk](${base}/ghboost_${a}.ipk)"
            done
            echo "- 界面包 → [luci-app-ghboost_all.ipk](${base}/luci-app-ghboost_all.ipk)"
            echo ""
            echo '```sh'
            echo "wget -O /tmp/ghboost.ipk ${base}/ghboost_<arch>.ipk"
            echo "wget -O /tmp/luci-app-ghboost.ipk ${base}/luci-app-ghboost_all.ipk"
            echo "opkg install /tmp/ghboost.ipk /tmp/luci-app-ghboost.ipk"
            echo '```'
          } > notes.md

          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" \
                 --title "ghboost (rolling)" --notes-file notes.md --latest=false
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" \
            --title "ghboost ${ver_core}-r${rel_core}" --notes-file notes.md --latest=false
